name: Sync schedule & deploy

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull schedule from Athletic.net
        run: python scripts/update_schedule.py

      - name: Commit schedule changes
        id: commit
        run: |
          if git diff --quiet data/schedule.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/schedule.json
            git commit -m "Sync schedule from Athletic.net"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Timed runs only redeploy when the schedule changed; pushes and manual runs always deploy.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'
